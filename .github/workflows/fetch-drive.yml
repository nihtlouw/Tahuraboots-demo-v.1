name: Fetch Drive Archive

# Workflow sementara: runner GitHub mengunduh file Google Drive, mengekstrak,
# lalu commit hasilnya ke branch ini supaya bisa diambil lewat git.
# Hapus setelah arsip berhasil diimpor.

on:
  push:
    paths:
      - '.github/workflows/fetch-drive.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install gdown
        run: pip install --quiet gdown

      - name: Download from Google Drive
        env:
          FILE_ID: 10d6x8rjkqrHxlFpy6kwAmkKiVSLamDhD
        run: |
          set -euo pipefail
          mkdir -p _drive_tmp
          gdown "https://drive.google.com/uc?id=${FILE_ID}" -O _drive_tmp/archive.bin \
            || gdown --fuzzy "https://drive.google.com/file/d/${FILE_ID}/view" -O _drive_tmp/archive.bin
          echo "size: $(stat -c%s _drive_tmp/archive.bin) bytes"
          file _drive_tmp/archive.bin

      - name: Unpack
        run: |
          set -euo pipefail
          mkdir -p _drive_tmp/extracted
          if file _drive_tmp/archive.bin | grep -qi 'zip archive'; then
            unzip -q -o _drive_tmp/archive.bin -d _drive_tmp/extracted
          elif file _drive_tmp/archive.bin | grep -qi 'gzip compressed'; then
            tar -xzf _drive_tmp/archive.bin -C _drive_tmp/extracted
          elif file _drive_tmp/archive.bin | grep -qi 'RAR archive'; then
            sudo apt-get update -qq && sudo apt-get install -y -qq unrar
            unrar x -o+ _drive_tmp/archive.bin _drive_tmp/extracted/
          else
            cp _drive_tmp/archive.bin _drive_tmp/extracted/archive.bin
          fi
          echo "--- struktur ---"
          find _drive_tmp/extracted -maxdepth 3 | head -100
          echo "--- jumlah file ---"
          find _drive_tmp/extracted -type f | wc -l
          echo "--- ukuran total ---"
          du -sh _drive_tmp/extracted

      - name: Commit hasil ke branch
        run: |
          set -euo pipefail
          rm -rf _import
          mkdir -p _import
          cp -a _drive_tmp/extracted/. _import/
          git config user.name "arena-import-bot"
          git config user.email "agent@arena.ai"
          git add -A _import
          git commit -m "chore(import): unggah arsip dari Google Drive" || echo "tidak ada perubahan"
          git push origin HEAD:${{ github.ref_name }}
